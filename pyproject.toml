[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pedigree_matrix"
dynamic = ["version"]
description = "Estimate life-cycle inventory uncertainty with the ecoinvent pedigree matrix"
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Mutel", email = "cmutel@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/brightway-lca/pedigree_matrix"
Repository = "https://github.com/brightway-lca/pedigree_matrix"
Changelog = "https://github.com/brightway-lca/pedigree_matrix/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pedigree_matrix"]

[tool.setuptools.dynamic]
version = { attr = "pedigree_matrix.version.version" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
norecursedirs = ["venv", "manual"]
